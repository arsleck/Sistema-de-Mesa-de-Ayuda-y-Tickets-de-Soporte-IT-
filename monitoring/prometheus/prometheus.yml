# Prometheus: cada 5 segundos consulta /metrics del backend y guarda las series de tiempo
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: helpdesk-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:5000']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
