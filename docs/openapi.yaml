openapi: 3.0.3
info:
  title: HelpDesk Pro – API Sistema de Mesa de Ayuda IT
  version: 2.0.0
  description: |
    API REST del sistema de tickets de soporte IT.

    **Cómo probarla en esta página (Swagger UI):**
    1. Ejecuta `POST /api/auth/login` con un usuario válido.
    2. Copia el `access_token` de la respuesta.
    3. Pulsa el botón **Authorize** (arriba a la derecha) y pégalo.
    4. Ya puedes probar los endpoints protegidos con el candado.

    **Roles (RBAC):** `employee` (usuario), `agent` (técnico) y `admin`.
servers:
  - url: http://127.0.0.1:5000
    description: Desarrollo local
  - url: http://localhost:8080
    description: Docker Compose / Kubernetes (vía Nginx del frontend)
tags:
  - name: Monitoreo
  - name: Autenticación
  - name: Usuarios
  - name: Tickets

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: "No tienes permisos para realizar esta acción" }
    Message:
      type: object
      properties:
        message: { type: string }
    RegisterInput:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, maxLength: 80, example: "usuario123" }
        email: { type: string, format: email, example: "usuario@empresa.com" }
        password: { type: string, minLength: 6, example: "clave_segura_1" }
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: "admin_soporte" }
        password: { type: string, example: "super_secreta_123" }
    LoginResponse:
      type: object
      properties:
        message: { type: string }
        access_token: { type: string, description: "JWT de vida corta para el header Authorization" }
        refresh_token: { type: string, description: "Token para renovar la sesión en /api/auth/refresh" }
        username: { type: string }
        role: { type: string, enum: [employee, agent, admin] }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        role: { type: string, enum: [employee, agent, admin] }
    Agent:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
    TicketInput:
      type: object
      required: [title, description]
      properties:
        title: { type: string, maxLength: 100, example: "La impresora del piso 3 no enciende" }
        description: { type: string, example: "Se revisaron los cables pero arroja el error E02." }
        priority: { type: string, enum: [Baja, Media, Alta], default: Media }
    TicketUpdate:
      type: object
      description: |
        Staff (agent/admin): `status`, `assigned_to_id`, `priority`.
        Creador (employee): `title`, `description`, `priority` mientras el ticket esté **Abierto**.
      properties:
        status: { type: string, enum: [Abierto, En Progreso, Resuelto] }
        priority: { type: string, enum: [Baja, Media, Alta] }
        assigned_to_id: { type: integer, nullable: true }
        title: { type: string }
        description: { type: string }
    Ticket:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [Abierto, En Progreso, Resuelto] }
        priority: { type: string, enum: [Baja, Media, Alta] }
        created_by_id: { type: integer }
        assigned_to_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        creator_username: { type: string }
        assignee_username: { type: string, nullable: true }
    Stats:
      type: object
      properties:
        total: { type: integer }
        unassigned: { type: integer }
        by_status:
          type: object
          additionalProperties: { type: integer }
          example: { "Abierto": 3, "En Progreso": 1, "Resuelto": 4 }
        by_priority:
          type: object
          additionalProperties: { type: integer }
          example: { "Baja": 2, "Media": 4, "Alta": 2 }
        by_agent:
          type: array
          items:
            type: object
            properties:
              agent: { type: string }
              count: { type: integer }
  responses:
    Unauthorized:
      description: Falta el token JWT o es inválido/expirado
      content:
        application/json:
          schema: { type: object, properties: { msg: { type: string } } }
    Forbidden:
      description: El rol del usuario no tiene permiso (RBAC)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Datos inválidos o incompletos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /health:
    get:
      tags: [Monitoreo]
      summary: Estado del servicio y de la base de datos
      responses:
        '200':
          description: El servidor y la base de datos responden
          content:
            application/json:
              example: { status: ok, database: ok, message: "API de la Mesa de Ayuda funcionando correctamente" }
        '503':
          description: La API responde pero la base de datos no

  /api/auth/register:
    post:
      tags: [Autenticación]
      summary: Registro público (siempre crea rol employee)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { description: Usuario creado, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: El usuario o correo ya existe }

  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Inicio de sesión – devuelve el JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { description: Login correcto, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Credenciales inválidas }
        '429': { description: Demasiados intentos (máximo 5 por minuto por IP) }

  /api/auth/refresh:
    post:
      tags: [Autenticación]
      summary: Renovar el access token (enviar el refresh_token como Bearer)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Nuevo access token
          content:
            application/json:
              schema: { type: object, properties: { access_token: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión revocando el token (lista negra en servidor)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Token revocado }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      tags: [Autenticación]
      summary: Datos del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Perfil, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/admin/register:
    post:
      tags: [Usuarios]
      summary: Crear técnico (solo admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { description: Técnico creado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: El usuario o correo ya existe }

  /api/auth/agents:
    get:
      tags: [Usuarios]
      summary: Técnicos disponibles para asignación (solo staff)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de técnicos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Agent' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/users:
    get:
      tags: [Usuarios]
      summary: Listado de usuarios (solo admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/tickets:
    get:
      tags: [Tickets]
      summary: Listar tickets (employee ve solo los suyos; staff ve todos)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [Abierto, En Progreso, Resuelto] } }
        - { in: query, name: priority, schema: { type: string, enum: [Baja, Media, Alta] } }
        - { in: query, name: q, description: Texto a buscar en asunto o detalle, schema: { type: string } }
      responses:
        '200':
          description: Lista de tickets
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Ticket' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tickets]
      summary: Crear ticket
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketInput' }
      responses:
        '201':
          description: Ticket creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  ticket: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/tickets/stats:
    get:
      tags: [Tickets]
      summary: Métricas para el dashboard
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Métricas, content: { application/json: { schema: { $ref: '#/components/schemas/Stats' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/tickets/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [Tickets]
      summary: Consultar un ticket
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Ticket, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tickets]
      summary: Actualizar estado, asignación, prioridad o contenido
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketUpdate' }
      responses:
        '200': { description: Ticket actualizado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: El ticket ya no está Abierto y el creador no puede editarlo }
    delete:
      tags: [Tickets]
      summary: Eliminar ticket (solo staff)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Ticket eliminado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
