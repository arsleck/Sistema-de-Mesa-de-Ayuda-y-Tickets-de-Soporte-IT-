# Nginx: sirve la app React y reenvía las llamadas de la API al backend.
# Así el navegador habla con un único dominio (sin problemas de CORS).
# Es una PLANTILLA: al arrancar, Nginx reemplaza ${BACKEND_URL} por la variable de entorno
# (Docker/Kubernetes: http://backend:5000 · Azure Container Apps: http://helpdesk-backend).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Peticiones a la API y monitoreo -> contenedor/servicio "backend"
    location ~ ^/(api|health) {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $proxy_host;                 # Azure enruta por el nombre del backend
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # IP real del usuario
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: cualquier ruta (/tickets, /verificacion...) devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos compilados con caché larga (llevan un hash en el nombre)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
