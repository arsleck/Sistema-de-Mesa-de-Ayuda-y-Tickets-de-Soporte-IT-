# Autoescalado horizontal (HPA): si la CPU promedio supera el 50 %, Kubernetes
# agrega réplicas del backend (máx. 6); cuando baja la carga, las retira (mín. 2).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: helpdesk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # espera 1 min antes de reducir (evita subir/bajar sin parar)
