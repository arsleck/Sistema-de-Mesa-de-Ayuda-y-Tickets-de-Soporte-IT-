# Prometheus dentro de Kubernetes: descubre AUTOMÁTICAMENTE cada pod con la anotación
# prometheus.io/scrape="true". Cuando el HPA crea un pod nuevo, empieza a medirse solo.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: helpdesk-backend
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [helpdesk] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
