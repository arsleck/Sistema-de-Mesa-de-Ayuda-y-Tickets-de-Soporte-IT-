# Prometheus + Grafana dentro del clúster.
# Sus archivos de configuración se cargan como ConfigMaps desde las carpetas
# monitoring/ y k8s/monitoring/ (los crea el script k8s/deploy.ps1).
# ------------------------------------------------------------------ Permisos (RBAC)
# Prometheus necesita permiso para LISTAR pods y así descubrir las réplicas
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: helpdesk
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: helpdesk
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: helpdesk
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: helpdesk }
roleRef:
  { kind: Role, name: prometheus-discovery, apiGroup: rbac.authorization.k8s.io }
---
# ------------------------------------------------------------------ Prometheus
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: helpdesk
  labels: { app: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: [--config.file=/etc/prometheus/prometheus.yml]
          ports: [{ containerPort: 9090 }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: helpdesk
spec:
  type: NodePort
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090, nodePort: 30090 }]
---
# ------------------------------------------------------------------ Grafana
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: helpdesk
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports: [{ containerPort: 3000 }]
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/helpdesk.json }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }      # lectura sin login (rol Viewer)
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: providers, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: providers
          configMap: { name: grafana-providers }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: helpdesk
spec:
  type: NodePort
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30300 }]
