# PostgreSQL con almacenamiento persistente (PVC): los datos sobreviven aunque el pod se reinicie
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: helpdesk
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: helpdesk
  labels: { app: postgres }
spec:
  replicas: 1                     # una sola instancia: la BD no se escala horizontalmente así
  strategy: { type: Recreate }    # evita dos pods escribiendo el mismo volumen
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: helpdesk-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: helpdesk-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: helpdesk-secrets, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres                  # nombre DNS interno: postgres:5432
  namespace: helpdesk
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
